name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: repo-context-map scan examples/sample-python --output reports/context-map.md
      - run: repo-context-map scan examples/sample-python --format agent-brief --output reports/AGENT_BRIEF.md
      - run: repo-context-map scan examples/sample-python --format agent-prompt --task "Add input validation" --output reports/AGENT_PROMPT.md
      - run: repo-context-map scan examples/sample-python --format manifest --output reports/context-manifest.txt
      - run: repo-context-map scan examples/sample-python --format context-bundle --output reports/context-bundle.md
